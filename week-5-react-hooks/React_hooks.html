<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>React Hooks — Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 650px; margin: 40px auto; }
    h1 { color: #2c3e50; }
    h2 { color: #2c3e50; margin-top: 40px; border-top: 1px solid #eee; padding-top: 20px; }
    .card { border: 1px solid #ccc; border-radius: 6px; padding: 12px 16px; margin-bottom: 12px; }
    button { padding: 6px 12px; margin-right: 6px; cursor: pointer; }
    input { padding: 6px; }
  </style>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <h1>React Hooks — Demo</h1>
  <p>Open the console to see effect logs as you interact with each section.</p>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

   
    function useFetch(url) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        let cancelled = false;
        setLoading(true);

        fetch(url)
          .then((res) => res.json())
          .then((json) => {
            if (!cancelled) {
              setData(json);
              setLoading(false);
            }
          });

        
        return () => {
          cancelled = true;
        };
      }, [url]);

      return { data, loading };
    }

   
    function Counter() {
      const [count, setCount] = useState(0);

      // useEffect with a dependency array — runs only when `count` changes.
      // Here it's used to sync the document title with state.
      useEffect(() => {
        document.title = `Count: ${count}`;
        console.log("Counter effect ran — count is now", count);
      }, [count]);

      return (
        <div className="card">
          <h2>useState + useEffect</h2>
          <p>Count: {count}</p>
          <button onClick={() => setCount(count - 1)}>-</button>
          <button onClick={() => setCount(count + 1)}>+</button>
          <p style={{ fontSize: "0.9em", color: "#666" }}>
            Check the browser tab title — it updates with the count.
          </p>
        </div>
      );
    }


    function FocusInput() {
      const inputRef = useRef(null);
      const renderCount = useRef(1); // tracks renders silently

      renderCount.current += 1;

      return (
        <div className="card">
          <h2>useRef</h2>
          <input ref={inputRef} type="text" placeholder="Click the button to focus me" />
          <button onClick={() => inputRef.current.focus()}>Focus Input</button>
          <p style={{ fontSize: "0.9em", color: "#666" }}>
            This component has rendered {renderCount.current} time(s) — tracked
            with useRef, which does NOT trigger a re-render itself.
          </p>
        </div>
      );
    }


    function PostList() {
      const { data, loading } = useFetch(
        "https://jsonplaceholder.typicode.com/posts?_limit=3"
      );

      return (
        <div className="card">
          <h2>Custom Hook (useFetch)</h2>
          {loading ? (
            <p>Loading posts...</p>
          ) : (
            <ul>
              {data.map((post) => (
                <li key={post.id}>{post.title}</li>
              ))}
            </ul>
          )}
        </div>
      );
    }

    function App() {
      return (
        <>
          <Counter />
          <FocusInput />
          <PostList />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
