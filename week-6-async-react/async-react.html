<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Asynchronous React Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 650px; margin: 40px auto; }
    h1 { color: #2c3e50; }
    h2 { color: #2c3e50; margin-top: 40px; border-top: 1px solid #eee; padding-top: 20px; }
    .card { border: 1px solid #ccc; border-radius: 6px; padding: 12px 16px; margin-bottom: 12px; }
    input, textarea { display: block; width: 100%; padding: 6px; margin-bottom: 8px; box-sizing: border-box; }
    button { padding: 8px 14px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
  </style>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <h1>Asynchronous React Demo</h1>
  <p>We open console to see JSON payloads and Promise resolution order as they happen.</p>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;


    function fetchPostPromiseStyle(id) {
      return fetch(`https://jsonplaceholder.typicode.com/posts/${id}`)
        .then((response) => {
          if (!response.ok) throw new Error(`Status ${response.status}`);
          return response.json(); 
        })
        .then((data) => {
          console.log("Promise-style result:", data);
          return data;
        })
        .catch((error) => {
          console.error("Promise-style error:", error);
          throw error;
        });
    }


    async function fetchPostAsyncStyle(id) {
      try {
        const response = await fetch(`https://jsonplaceholder.typicode.com/posts/${id}`);
        if (!response.ok) throw new Error(`Status ${response.status}`);
        const data = await response.json();
        console.log("Async/await result:", data);
        return data;
      } catch (error) {
        console.error("Async/await error:", error);
        throw error;
      }
    }

    function PromiseVsAsync() {
      const [result, setResult] = useState(null);

      return (
        <div className="card">
          <h2>Promises vs Async/Await</h2>
          <button onClick={() => fetchPostPromiseStyle(1).then(setResult)}>
            Fetch with .then() chain
          </button>{" "}
          <button onClick={async () => setResult(await fetchPostAsyncStyle(2))}>
            Fetch with async/await
          </button>
          {result && (
            <pre>{JSON.stringify(result, null, 2)}</pre>
          )}
        </div>
      );
    }


    function PostForm() {
      const [formData, setFormData] = useState({ title: "", body: "" });
      const [status, setStatus] = useState("");
      const [response, setResponse] = useState(null);

      function handleChange(e) {
        const { name, value } = e.target;
        setFormData((prev) => ({ ...prev, [name]: value }));
      }


      async function handleSubmit(e) {
        e.preventDefault(); 
        setStatus("Submitting...");


        const payload = JSON.stringify({ ...formData, userId: 1 });
        console.log("JSON payload being sent:", payload);

        try {
          const res = await fetch("https://jsonplaceholder.typicode.com/posts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: payload,
          });
          const data = await res.json(); 
          setResponse(data);
          setStatus("Submitted!");
        } catch (error) {
          setStatus(`Error: ${error.message}`);
        }
      }

      return (
        <div className="card">
          <h2>Form Data + JSON (async submit)</h2>
          <form onSubmit={handleSubmit}>
            <input
              name="title"
              placeholder="Post title"
              value={formData.title}
              onChange={handleChange}
              required
            />
            <textarea
              name="body"
              placeholder="Post body"
              value={formData.body}
              onChange={handleChange}
              required
            />
            <button type="submit">Submit</button>
          </form>
          <p>{status}</p>
          {response && <pre>{JSON.stringify(response, null, 2)}</pre>}
        </div>
      );
    }

    function App() {
      return (
        <>
          <PostForm />
          <PromiseVsAsync />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
