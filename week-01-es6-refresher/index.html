<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ES6 Refresher — Student Grade Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
    h1 { color: #2c3e50; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #000000; color: white; }
    .pass { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }
    #summary { margin-top: 20px; font-size: 1.1em; }
  </style>
</head>
<body>
  <h1>Flexisaf Grade Tracker</h1>
  <p>Open the browser console (F12) to see the ES6 features live.</p>

  <table>
    <thead>
      <tr><th>Name</th><th>Score</th><th>Result</th></tr>
    </thead>
    <tbody id="studentTable"></tbody>
  </table>

  <div id="summary"></div>

  <script src="script.js"></script>
</body>
</html>
