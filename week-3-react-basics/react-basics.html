<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>React Basics — Student Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 650px; margin: 40px auto; }
    h1 { color: #2c3e50; }
    h2 { color: #2c3e50; margin-top: 40px; border-top: 1px solid #eee; padding-top: 20px; }
    .card { border: 1px solid #ccc; border-radius: 6px; padding: 10px 14px; margin-bottom: 8px; }
    .pass { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }
    button { padding: 8px 14px; margin-top: 10px; cursor: pointer; }
    .clock { font-size: 1.4em; font-weight: bold; color: #2c3e50; }
  </style>

  
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <h1>React Basics — Student Dashboard</h1>
  <p>Console shows lifecycle logs as we mount/unmount components.</p>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;


    function StudentCard(props) {
      const { name, score } = props;
      const result = score >= 50 ? "Pass" : "Fail";
      return (
        <div className="card">
          <strong>{name}</strong> — {score} —{" "}
          <span className={result === "Pass" ? "pass" : "fail"}>{result}</span>
        </div>
      );
    }


    function StudentList({ students }) {
      return (
        <>
          <h2>Students</h2>
          {students.map((s) => (
            <StudentCard key={s.name} name={s.name} score={s.score} />
          ))}
        </>
      );
    }


    class Clock extends React.Component {
      constructor(props) {
        super(props);
        this.state = { time: new Date().toLocaleTimeString() };
      }

      componentDidMount() {
        console.log("Clock mounted — starting timer");
        this.timerID = setInterval(() => {
          this.setState({ time: new Date().toLocaleTimeString() });
        }, 1000);
      }

      componentWillUnmount() {
        console.log("Clock unmounting — clearing timer");
        clearInterval(this.timerID);
      }

      render() {
        return (
          <div className="card">
            <div className="clock">{this.state.time}</div>
          </div>
        );
      }
    }


    function App() {
      const [students, setStudents] = useState([
        { name: "Ibrahim", score: 78 },
        { name: "Bola Tinubu", score: 45 },
        { name: "Michael", score: 92 },
      ]);
      const [nextScore, setNextScore] = useState(60);

      // useEffect = functional lifecycle hook.
      // Runs after every render where `students` has changed.
      useEffect(() => {
        console.log("Students list updated:", students);
      }, [students]);


      function handleAddStudent() {
        const newStudent = {
          name: `Student ${students.length + 1}`,
          score: nextScore,
        };
        setStudents([...students, newStudent]);
        setNextScore((prev) => (prev + 15) % 100); // vary next score a bit
      }

      return (
        <>
          <StudentList students={students} />
          <button onClick={handleAddStudent}>+ Add Random Student</button>

          <h2>Live Clock (Class Component)</h2>
          <Clock />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
